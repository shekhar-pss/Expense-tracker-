{% load static %}
<aside class="sidebar" id="appSidebar">
  <a href="{% url 'expenses:dashboard' %}" class="brand-logo text-decoration-none mb-4 px-1" style="color: var(--ef-text);">
    <span class="logo-badge"><i class="bi bi-wallet2"></i></span>
    ExpenseFlow
  </a>

  <nav class="nav flex-column">
    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'expenses:dashboard' %}">
      <i class="bi bi-grid-1x2-fill"></i> Dashboard
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'add_expense' %}active{% endif %}" href="{% url 'expenses:add_expense' %}">
      <i class="bi bi-plus-circle-fill"></i> Add Expense
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'expense_list' %}active{% endif %}" href="{% url 'expenses:expense_list' %}">
      <i class="bi bi-receipt"></i> Expense History
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}" href="{% url 'expenses:reports' %}">
      <i class="bi bi-file-earmark-bar-graph"></i> Reports
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}" href="{% url 'analytics:analytics' %}">
      <i class="bi bi-graph-up"></i> Analytics
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'category_list' %}active{% endif %}" href="{% url 'expenses:category_list' %}">
      <i class="bi bi-tags-fill"></i> Categories
    </a>

    <hr class="my-2" style="border-color: var(--ef-border);">

    <a class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'users:profile' %}">
      <i class="bi bi-person-circle"></i> Profile
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}" href="{% url 'users:settings' %}">
      <i class="bi bi-gear-fill"></i> Settings
    </a>
    <a class="nav-link" href="{% url 'users:logout' %}">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </nav>

  {% if user_profile and user_profile.monthly_budget %}
  <div class="mt-4 p-3 rounded-3" style="background: var(--ef-gradient-soft);">
    <div class="small fw-bold text-muted-ef mb-1">Monthly Budget</div>
    <div class="fw-bold" style="color: var(--ef-primary);">{{ currency_symbol }}{{ user_profile.monthly_budget }}</div>
  </div>
  {% endif %}
</aside>
