{% extends 'base_public.html' %}
{% block title %}Forgot Password - ExpenseFlow{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 480px;">
    <div class="auth-form-side">
      <div class="brand-logo mb-4">
        <span class="logo-badge"><i class="bi bi-wallet2"></i></span>
        ExpenseFlow
      </div>
      <h3 class="fw-bold mb-1">Forgot Password</h3>
      <p class="text-muted-ef mb-4">Enter your registered email and we'll send you a reset link.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">{{ form.email.label }}</label>
          {{ form.email }}
        </div>
        <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 fw-bold">Send Reset Link</button>
      </form>
      <p class="text-center mt-4 text-muted-ef">
        <a href="{% url 'users:login' %}" class="fw-bold text-decoration-none" style="color: var(--ef-primary);">
          <i class="bi bi-arrow-left"></i> Back to Login
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
